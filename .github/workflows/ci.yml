name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit tests, and production build
    runs-on: ubuntu-24.04
    env:
      NODE_ENV: production
      APP_BASE_URL: https://partners.example.invalid
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
      MIGRATE_DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
      AUTH_SECRET: ci-only-synthetic-secret-000000000000000000000000000000
      LOCAL_QUICK_LOGIN_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: node --test tests/hostcreator-deployment.test.mjs
      - run: npm run build
        env:
          APP_BASE_URL: https://partners.europodlahy.sk
      - name: Package HostCreators standalone runtime
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hostcreator-artifact
          node scripts/hostcreator-source-manifest.mjs create hostcreator-artifact/source-manifest.json "$GITHUB_SHA"
          tar --exclude='.env' --exclude='.env.*' \
            -czf hostcreator-artifact/runtime.tar.gz -C .next/standalone .
          printf '%s\n' "$GITHUB_SHA" > hostcreator-artifact/commit.txt
          (cd hostcreator-artifact && sha256sum runtime.tar.gz > SHA256SUMS)
          du -sh .next/standalone hostcreator-artifact/runtime.tar.gz
      - name: Upload HostCreators runtime
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: hostcreator-standalone-${{ github.sha }}
          path: hostcreator-artifact/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  acceptance:
    name: Isolated standalone API and browser acceptance
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    env:
      NODE_ENV: production
      APP_BASE_URL: https://partners.example.invalid
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3308/disabled
      MIGRATE_DATABASE_URL: mysql://ci:ci@127.0.0.1:3308/disabled
      AUTH_SECRET: ci-only-synthetic-secret-000000000000000000000000000000
      LOCAL_QUICK_LOGIN_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Generate ephemeral database credentials
        shell: bash
        run: |
          for name in MARIADB_ROOT_PASSWORD DB_APP_PASSWORD DB_MIGRATE_PASSWORD; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done
      - run: docker compose up -d --wait db
      - run: ACCEPTANCE_PHASE11=1 npm run test:acceptance
      - name: Stop the disposable CI database
        if: always()
        run: docker compose down

  dependency-audit:
    name: Full and production dependency audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - name: Run both audits and fail on high or critical findings
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high
          full_status=$?
          npm audit --omit=dev --audit-level=high
          production_status=$?
          if [[ "$full_status" -ne 0 || "$production_status" -ne 0 ]]; then
            exit 1
          fi
